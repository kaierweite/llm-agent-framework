<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FAFAF8"/>
  <rect x="0" y="0" width="1280" height="4" fill="#002FA7"/>
  <!-- Header -->
  <text x="60" y="50" font-family="Consolas, monospace" font-size="12" fill="#737373" letter-spacing="3">04 / 10 · TOOL CALLING</text>
  <line x1="60" y1="68" x2="1220" y2="68" stroke="#E0E0E0" stroke-width="1"/>
  <text x="60" y="110" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="36" font-weight="700" fill="#0A0A0A">工具调用引擎</text>
  <text x="60" y="140" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#737373">ReAct 范式：推理 → 行动 → 再推理</text>
  <!-- Left section: ReAct explanation -->
  <rect x="60" y="170" width="700" height="500" rx="6" fill="#F0F0EE"/>
  <!-- Flow diagram -->
  <text x="100" y="210" font-family="Consolas, monospace" font-size="11" fill="#002FA7" letter-spacing="2">ReAct 循环流程</text>
  <!-- Step boxes -->
  <rect x="100" y="230" width="140" height="50" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="170" y="260" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="600" fill="#0A0A0A" text-anchor="middle">LLM 推理</text>
  <text x="250" y="255" font-family="Consolas, monospace" font-size="18" fill="#002FA7">→</text>
  <rect x="270" y="230" width="140" height="50" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="340" y="260" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="600" fill="#0A0A0A" text-anchor="middle">解析调用</text>
  <text x="420" y="255" font-family="Consolas, monospace" font-size="18" fill="#002FA7">→</text>
  <rect x="440" y="230" width="140" height="50" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="510" y="260" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="600" fill="#0A0A0A" text-anchor="middle">执行工具</text>
  <text x="590" y="255" font-family="Consolas, monospace" font-size="18" fill="#002FA7">→</text>
  <rect x="610" y="230" width="130" height="50" rx="4" fill="#002FA7"/>
  <text x="675" y="260" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">结果注入</text>
  <!-- Loop arrow -->
  <text x="100" y="305" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#525252">↑ 最多 5 轮链式调用 · 总超时 120 秒</text>
  <!-- Tool list -->
  <line x1="100" y1="340" x2="730" y2="340" stroke="#E0E0E0" stroke-width="1"/>
  <text x="100" y="370" font-family="Consolas, monospace" font-size="11" fill="#737373" letter-spacing="2">内置工具 (15+)</text>
  <rect x="100" y="390" width="130" height="36" rx="4" fill="#FFFFFF"/>
  <text x="165" y="414" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#0A0A0A" text-anchor="middle">文件操作</text>
  <rect x="245" y="390" width="130" height="36" rx="4" fill="#FFFFFF"/>
  <text x="310" y="414" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#0A0A0A" text-anchor="middle">网络请求</text>
  <rect x="390" y="390" width="130" height="36" rx="4" fill="#FFFFFF"/>
  <text x="455" y="414" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#0A0A0A" text-anchor="middle">天气查询</text>
  <rect x="535" y="390" width="130" height="36" rx="4" fill="#FFFFFF"/>
  <text x="600" y="414" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#0A0A0A" text-anchor="middle">知识库检索</text>
  <rect x="100" y="440" width="130" height="36" rx="4" fill="#FFFFFF"/>
  <text x="165" y="464" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#0A0A0A" text-anchor="middle">历史搜索</text>
  <rect x="245" y="440" width="130" height="36" rx="4" fill="#FFFFFF"/>
  <text x="310" y="464" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#0A0A0A" text-anchor="middle">技能加载</text>
  <rect x="390" y="440" width="130" height="36" rx="4" fill="#FFFFFF"/>
  <text x="455" y="464" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#0A0A0A" text-anchor="middle">主题切换</text>
  <!-- Key insight -->
  <line x1="100" y1="510" x2="730" y2="510" stroke="#E0E0E0" stroke-width="1"/>
  <text x="100" y="545" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#0A0A0A" font-weight="600">LLM 自主决定用哪个工具、传什么参数</text>
  <text x="100" y="575" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#525252">并行执行：ThreadPoolExecutor · 统一超时 30 秒</text>
  <text x="100" y="600" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#525252">安全沙箱：路径白名单审计 · 支持自定义扩展</text>
  <!-- Right section: KPI -->
  <rect x="800" y="170" width="420" height="500" rx="6" fill="#002FA7"/>
  <!-- Big KPI -->
  <text x="1010" y="280" font-family="Consolas, monospace" font-size="12" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle" letter-spacing="3">工具调用准确率</text>
  <text x="1010" y="380" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="96" font-weight="700" fill="#FFFFFF" text-anchor="middle">93.3%</text>
  <rect x="910" y="410" width="200" height="3" rx="1.5" fill="#5B7BFF"/>
  <text x="1010" y="450" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">30 道测试 · 28 道正确</text>
  <!-- Secondary stat -->
  <line x1="840" y1="500" x2="1180" y2="500" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
  <text x="1010" y="540" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle">最多 5 轮链式调用</text>
  <text x="1010" y="570" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle">文件操作类工具正确率 100%</text>
  <text x="1010" y="600" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle">平均耗时 698ms</text>
  <!-- Footer -->
  <text x="60" y="695" font-family="Consolas, monospace" font-size="11" fill="#737373">LLM Agent Framework · Graduation Defense 2026</text>
</svg>
